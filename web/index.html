<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Markdown Reader</title>
<link id="hl" rel="stylesheet" href="/vendor/hl-light.css">
<link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/orientation.css"><link rel="stylesheet" href="/review.css"><link rel="stylesheet" href="/release.css"><link rel="stylesheet" href="/shell.css"><link rel="stylesheet" href="/polish.css"></head>
<body>
<header>
  <button class="ib" id="navtog" title="Toggle sidebar (b)" aria-label="Toggle sidebar">☰</button>
  <div class="context"><div class="crumb" id="crumb">Markdown Reader</div><small id="current-section"></small></div>
  <button id="file-menu">File</button><button id="view-menu">View</button><button id="navigate-menu">Navigate</button>
  <button class="ib" id="fsm" title="Smaller text" aria-label="Smaller text">A−</button>
  <button class="ib" id="fsp" title="Larger text" aria-label="Larger text">A+</button>
  <span class="sep"></span>
  <button class="ib" id="theme" title="Theme" aria-label="Theme">◐</button>
  <button class="ib" id="print" title="Print / save as PDF" aria-label="Print">⎙</button>
  <button id="appearance" aria-label="Appearance">Aa</button>
  <button id="focus">Focus</button>
  <button id="toctog" aria-label="Toggle outline">Outline</button>
</header>
<div class="layout">
  <nav id="nav" aria-label="Documents">
    <div class="nav-top">
      <strong>Workspace</strong>
      <div class="rootrow">
        <select id="roots" aria-label="Folder"></select>
        <button id="add" title="Add a folder">＋</button>
        <button id="rm" title="Remove this folder from the list (files are kept)">−</button>
      </div>
      <input id="q" type="search" placeholder="Search files and contents…  ( / )" autocomplete="off">
      <details id="search-options"><summary>Search options</summary><label>Scope <select id="search-scope"><option value="workspace">Workspace</option><option value="folder">Current folder</option><option value="document">Current document</option></select></label><label><input id="search-phrase" type="checkbox">Exact phrase</label><label><input id="search-case" type="checkbox">Case sensitive</label><label><input id="search-word" type="checkbox">Whole word</label></details>
      <input id="tree-filter" type="search" aria-label="Filter files" placeholder="Filter filenames and titles">
      <div class="tree-actions"><button id="reveal-current">Reveal current file</button><button id="collapse-all">Collapse all</button></div>
      <div class="hint" id="hint"></div>
    </div>
    <div id="list"></div>
  </nav>
  <div id="nav-resizer" class="resizer" role="separator" aria-label="Documents width" aria-orientation="vertical" tabindex="0"></div>
  <main class="reading-area" aria-label="Document reader">
    <div id="review-tools"><button id="back-results" hidden>Back to results</button><button id="compare-open">Compare</button><button id="lists-open">Reading lists</button><button id="notes-open">Review notes</button></div>
  <div class="scroller" id="scroller" tabindex="-1">
    <div id="chain" aria-label="Related documents" hidden></div>
    <div id="trail-bar" hidden><button id="trail-return"></button><button id="trail-list">Trail</button></div>
    <div id="find-bar" hidden><input id="find-query" aria-label="Find in document"><button id="find-prev">Previous</button><button id="find-next">Next</button><span id="find-count" role="status"></span><button id="find-close">Close find</button></div>
    <div class="wrap">
      <article id="doc"><p class="empty">Select a file from the sidebar.</p></article>
      <aside class="toc" id="toc"></aside>
    </div>
  </div>
  </main>
</div>
<dialog id="results-dialog" aria-label="Search results"><h2>Search results</h2><div id="search-results"></div><button data-close-dialog>Close</button></dialog>
<dialog id="compare-dialog" aria-label="Compare documents"><div class="compare-toolbar"><label>Left document <select id="compare-left"></select></label><label>Right document <select id="compare-right"></select></label><button id="compare-load">Compare selected</button><label>Section <select id="compare-section"></select></label><button data-close-dialog>Exit Compare</button></div><p id="compare-status" role="status"></p><div id="compare-panes"><section class="compare-pane" tabindex="0" aria-label="Left reading pane"><article class="compare-article"></article></section><section class="compare-pane" tabindex="0" aria-label="Right reading pane"><article class="compare-article"></article></section></div></dialog>
<dialog id="lists-dialog" aria-label="Reading lists"><h2>Reading lists</h2><label>List name <input id="list-name" maxlength="100"></label><button id="list-create">Create list</button><label>List <select id="list-select"></select></label><button id="list-rename">Rename</button><button id="list-delete">Delete list</button><button id="list-add">Add current section</button><div id="list-items"></div><p id="list-status" role="status"></p><button data-close-dialog>Close</button></dialog>
<dialog id="notes-dialog" aria-label="Review notes"><h2>Review notes</h2><p id="note-anchor"></p><label>Note <textarea id="note-text" maxlength="4000"></textarea></label><button id="note-add">Save note</button><div id="note-items"></div><button id="notes-export">Export selected notes</button><p id="note-status" role="status"></p><button data-close-dialog>Close</button></dialog>
<dialog id="export-dialog" aria-label="Export notes"><h2>Notes to paste</h2><textarea id="export-text" readonly aria-label="Markdown notes"></textarea><button id="export-copy">Copy notes</button><button data-close-dialog>Close</button></dialog>
<dialog id="reader-menu" aria-label="Reader menu"><h2 id="reader-menu-title"></h2><div id="reader-menu-items"></div><button data-close-dialog>Close</button></dialog>
<dialog id="quick-dialog" aria-labelledby="quick-title"><h2 id="quick-title">Quick open</h2><input id="quick-query" aria-label="Find file" autocomplete="off"><div id="quick-results"></div><button data-close-dialog>Close</button></dialog>
<dialog id="peek-dialog" aria-labelledby="peek-title"><h2 id="peek-title">Peek section</h2><div id="peek-content"></div><button id="peek-open">Open here</button><button data-close-dialog>Return</button></dialog>
<dialog id="dlg"><h3>Add a folder</h3><p id="bpath"></p><div id="blist"></div>
<div class="dact"><button id="bcancel">Cancel</button><button class="pri" id="bok">Add this folder</button></div></dialog>
<dialog id="appearance-dialog" aria-labelledby="appearance-title"><h2 id="appearance-title">Reading appearance</h2><fieldset><legend>Theme</legend><label><input type="radio" name="appearance-theme" value="light"> Light</label><label><input type="radio" name="appearance-theme" value="dark"> Dark</label><label><input type="radio" name="appearance-theme" value="auto"> Auto</label></fieldset><label>Typeface <select id="font"><option value="serif">Serif</option><option value="sans">Sans</option></select></label><label>Text size <output id="size-value" for="text-size">18px</output><input id="text-size" type="range" min="13" max="24" value="18"></label><label>Reading width <output id="measure-value" for="measure">80 characters</output><input id="measure" type="range" min="60" max="140" value="80"></label><label class="fill-control"><input id="fill-window" type="checkbox"> Fill window</label><button id="reset">Reset appearance</button><button id="appearance-close">Close</button></dialog>
<div class="toast" id="toast" role="status"></div>
<script src="/vendor/marked.min.js"></script><script src="/vendor/purify.min.js"></script><script src="/vendor/highlight.min.js"></script>
<script type="module" src="/app.js"></script>
</body></html>
